<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5b978">
  <title>鹈鹕骑行记 · SVG 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324a;
      --cream: #fff6df;
      --coral: #e85f4c;
      --sky: #f5b978;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: #17324a;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }

    main {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 520px;
      isolation: isolate;
      background: var(--sky);
    }

    .scene {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      animation: scene-in 900ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    .masthead {
      position: absolute;
      z-index: 5;
      top: clamp(22px, 4vw, 54px);
      left: clamp(24px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--ink);
      pointer-events: none;
    }

    .masthead__mark {
      width: 34px;
      height: 34px;
      border: 2px solid currentColor;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 17px;
      transform: rotate(-8deg);
    }

    .masthead__copy { line-height: 1; }

    .masthead strong {
      display: block;
      font-size: clamp(15px, 1.5vw, 22px);
      letter-spacing: .12em;
    }

    .masthead span {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity: .72;
    }

    .caption {
      position: absolute;
      z-index: 5;
      right: clamp(24px, 5vw, 72px);
      bottom: clamp(22px, 4vw, 48px);
      margin: 0;
      color: var(--cream);
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(14px, 1.45vw, 21px);
      font-style: italic;
      letter-spacing: .04em;
      text-shadow: 0 2px 12px rgba(23, 50, 74, .32);
    }

    .motion-toggle {
      position: absolute;
      z-index: 8;
      top: clamp(22px, 4vw, 52px);
      right: clamp(24px, 5vw, 72px);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 15px;
      border: 1.5px solid rgba(23, 50, 74, .55);
      border-radius: 999px;
      background: rgba(255, 246, 223, .22);
      color: var(--ink);
      font: 700 11px/1 "Trebuchet MS", "Microsoft YaHei", sans-serif;
      letter-spacing: .14em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .motion-toggle:hover {
      transform: translateY(-2px);
      background: rgba(255, 246, 223, .42);
      box-shadow: 0 8px 24px rgba(23, 50, 74, .12);
    }

    .motion-toggle:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 3px;
    }

    .motion-toggle__icon {
      display: inline-grid;
      grid-template-columns: repeat(2, 3px);
      gap: 4px;
      width: 10px;
      height: 13px;
    }

    .motion-toggle__icon::before,
    .motion-toggle__icon::after {
      content: "";
      border-radius: 2px;
      background: currentColor;
    }

    .is-paused .motion-toggle__icon {
      display: block;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid currentColor;
    }

    .is-paused .motion-toggle__icon::before,
    .is-paused .motion-toggle__icon::after { display: none; }

    .is-paused *,
    .is-paused *::before,
    .is-paused *::after { animation-play-state: paused !important; }

    .clouds { animation: clouds-drift 32s linear infinite; }
    .clouds--far { animation-duration: 52s; animation-direction: reverse; }
    .road-marks { animation: road-scroll 1.05s linear infinite; }
    .grass-streaks { animation: road-scroll .72s linear infinite; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: wheel-spin 1.05s linear infinite; }
    .pedals { transform-box: fill-box; transform-origin: center; animation: wheel-spin 1.05s linear infinite; }
    .rider { animation: rider-bob .52s ease-in-out infinite alternate; }
    .wing { transform-box: fill-box; transform-origin: 70% 24%; animation: wing-sway 1.05s ease-in-out infinite; }
    .tail { transform-box: fill-box; transform-origin: 90% 50%; animation: tail-flick 1.05s ease-in-out infinite; }
    .head { animation: head-bob 1.05s ease-in-out infinite; }
    .scarf-tail--one { animation: scarf-wave .7s ease-in-out infinite alternate; }
    .scarf-tail--two { animation: scarf-wave .7s .12s ease-in-out infinite alternate-reverse; }
    .front-foot { animation: foot-push 1.05s ease-in-out infinite; }
    .back-foot { animation: foot-push 1.05s .525s ease-in-out infinite; }
    .shadow { animation: shadow-breathe .52s ease-in-out infinite alternate; }
    .sun-rays { transform-box: fill-box; transform-origin: center; animation: rays-turn 24s linear infinite; }

    @keyframes scene-in { to { opacity: 1; } }
    @keyframes clouds-drift { to { transform: translateX(-620px); } }
    @keyframes road-scroll { to { transform: translateX(-240px); } }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes rider-bob { to { transform: translateY(5px) rotate(.25deg); } }
    @keyframes head-bob { 50% { transform: translateY(4px) rotate(1deg); } }
    @keyframes wing-sway { 50% { transform: rotate(-7deg) translate(-3px, 5px); } }
    @keyframes tail-flick { 50% { transform: rotate(5deg); } }
    @keyframes scarf-wave { to { transform: translateY(6px) skewX(6deg); } }
    @keyframes foot-push { 50% { transform: translate(8px, 7px); } }
    @keyframes shadow-breathe { to { transform: scaleX(.93); opacity: .14; } }
    @keyframes rays-turn { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      main { min-height: 460px; }
      .masthead__mark { width: 30px; height: 30px; }
      .motion-toggle { min-height: 38px; padding-inline: 12px; }
      .motion-toggle__label { display: none; }
      .caption { max-width: 190px; text-align: right; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene { opacity: 1; animation: none; }
      .scene * { animation: none !important; }
    }
  </style>
</head>
<body>

        <radialGradient id="sun-glow">

          <stop offset="1" stop-color="#fff8cf" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">

        </filter>
        <filter id="paper" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8" result="noise"/>
          <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
          <feComponentTransfer in="mono" result="faded">
            <feFuncA type="table" tableValues="0 .07"/>
          </feComponentTransfer>
          <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
        </filter>
        <clipPath id="scene-clip"><rect width="1440" height="900"/></clipPath>
      </defs>

  <script>
    const experience = document.querySelector('#experience');
    const toggle = document.querySelector('.motion-toggle');
    const label = toggle.querySelector('.motion-toggle__label');

    toggle.addEventListener('click', () => {
      const paused = experience.classList.toggle('is-paused');
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      label.textContent = paused ? '播放' : '暂停';
    });
  </script>
</body>
</html>
